server {
    listen 80;
    server_name _;

    # Doit rester >= a la limite applicative d'upload (requestSizeLimiter :
    # 40 Mo dans nuxt.config.ts). A 5 Mo, nginx renvoyait un 413 avant meme
    # que l'app ne voie la requete.
    client_max_body_size 40m;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support des WebSockets (HMR éventuel, connexions upgradées)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        proxy_read_timeout 60s;
    }
}
